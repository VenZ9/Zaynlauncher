# Memory settings sized for a 2 GB build container.
# Previously -Xmx2048m claimed the ENTIRE limit, so the kernel OOM-killed the Gradle daemon
# during dexing (DaemonDisappearedException: build daemon disappeared unexpectedly).
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC -Dfile.encoding=UTF-8
# One worker at a time, no parallel project execution: keeps peak memory predictable.
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.vfs.watch=false
# Compile Kotlin inside the Gradle daemon. A separate Kotlin daemon stays resident for hours
# after compiling, and that second JVM is what pushed the container over its limit.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
